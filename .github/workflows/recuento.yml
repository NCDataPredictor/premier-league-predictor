# Recuento nocturno de los picks de la Champions: cada noche (22:30 Bogotá) trae los resultados del día desde FotMob
# y liquida los picks publicados (docs/champions/data/recuento.json → sección Rendimiento de la web).
# Si ese día no hubo partidos no cambia nada y no se publica.
name: Recuento de picks (noche)
on:
  schedule:
    - cron: "30 3 * * *"          # 22:30 en Bogotá (UTC-5)
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: jornada-champions           # la misma que la jornada, para no chocar al publicar
  cancel-in-progress: false
jobs:
  recuento:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install numpy
      - name: Caché de lo crudo de FotMob
        uses: actions/cache@v4
        with:
          path: futbol/champions/raw
          key: fotmob-raw-${{ github.run_id }}
          restore-keys: fotmob-raw-
      - name: Resultados del día (FotMob)
        continue-on-error: true
        run: python -m futbol.datos.fotmob historico
      - name: Liquidar picks
        run: python -m futbol.recuento champions
      - name: Publicar
        env:
          HOOK: ${{ secrets.CF_DEPLOY_HOOK_NCDATA }}
        run: |
          git config user.name "ncdata-bot"
          git config user.email "ncdata-bot@users.noreply.github.com"
          git add futbol/champions/historico futbol/champions/recuento docs/champions/data/recuento.json docs/champions/data/resultados.json
          if git diff --cached --quiet -- futbol/champions/recuento futbol/champions/historico; then echo "Sin resultados nuevos"; exit 0; fi
          git commit -m "Recuento de picks de la Champions ($(date -u +%Y-%m-%d))"
          git pull --rebase -X theirs origin main
          git push origin HEAD:main
          # El push con el token de Actions no dispara el despliegue: se pide a Cloudflare aquí (como en jornada.yml).
          if [ -n "$HOOK" ]; then if curl -fsS -X POST "$HOOK" > /dev/null; then echo "Redespliegue pedido."; else echo "::warning::El deploy hook de Cloudflare falló"; fi; fi
